name: CD — Deploy Frontend to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Notifikasi awal deployment
      # ─────────────────────────────────────────
      - name: Notify deployment started
        run: |
          echo "🚀 Starting deployment of frontend..."
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"

      # ─────────────────────────────────────────
      # Deploy via SSH ke VPS
      # ─────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "📂 Navigating to frontend directory..."
            cd /home/nutrigrow/frontend

            echo "⬇️ Pulling latest changes..."
            git pull origin main

            echo "🔄 Rebuilding and restarting container..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

            echo "✅ Frontend deployment complete!"
            docker compose ps

      # ─────────────────────────────────────────
      # Health check setelah deploy
      # ─────────────────────────────────────────
      - name: Health check
        run: |
          echo "⏳ Waiting 20 seconds for service to start..."
          sleep 20
          echo "🏥 Running health check..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "http://${{ secrets.VPS_HOST }}:5173/" || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "⚠️ Health check returned status $STATUS — check logs on VPS"
            exit 1
          fi
