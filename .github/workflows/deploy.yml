name: CD — Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  validate:
    name: ✅ Pre-deploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        run: npx tsc -b --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Create dummy .env for build
        run: |
          echo "VITE_API_URL=https://api.nutrigrow.id" > .env

      - name: Build application
        run: npm run build

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/frontend.Dockerfile
          push: false
          tags: nutrigrow-frontend:deploy-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # Notifikasi awal deployment
      # ─────────────────────────────────────────
      - name: Notify deployment started
        run: |
          echo "🚀 Starting deployment of frontend..."
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Secret preflight
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USERNAME:?VPS_USERNAME secret is required}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is required}"
          : "${VPS_PORT:?VPS_PORT secret is required}"
          echo "✅ Required frontend deployment secrets are present"

      # ─────────────────────────────────────────
      # Deploy via SSH ke VPS
      # ─────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "📂 Navigating to frontend directory..."
            cd /home/nutrigrow/frontend

            echo "⬇️ Pulling latest changes..."
            git pull origin main

            echo "🔄 Rebuilding and restarting container..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

            echo "✅ Frontend deployment complete!"
            docker compose ps

      # ─────────────────────────────────────────
      # Health check setelah deploy
      # ─────────────────────────────────────────
      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          FRONTEND_HEALTHCHECK_URL: ${{ secrets.FRONTEND_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          HEALTHCHECK_URL="${FRONTEND_HEALTHCHECK_URL:-http://${VPS_HOST}:5173/}"
          echo "⏳ Waiting 20 seconds for service to start..."
          sleep 20
          echo "🏥 Running health check at ${HEALTHCHECK_URL}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${HEALTHCHECK_URL}" || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "⚠️ Health check returned status $STATUS — check logs on VPS"
            exit 1
          fi
