name: CI — Frontend

on:
  pull_request:
    branches:
      - main
      - dev
      - develop
  push:
    branches:
      - main
      - dev
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint TypeScript & ESLint
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 TypeScript & ESLint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        run: npx tsc -b --noEmit

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────
  # JOB 2: Build Check
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Vite Build Check
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create dummy .env for build
        run: |
          echo "VITE_API_URL=https://api.nutrigrow.id" > .env

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Security Audit
  # ─────────────────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

      - name: Detect hardcoded secrets in source
        run: |
          set -euo pipefail

          FOUND=$(grep -RInE \
            "(VITE_API_URL|SUPABASE_ANON_KEY|PAYMENT_GATEWAY_KEY|MIDTRANS_CLIENT_KEY)\s*=\s*['\"][^'\"\$\{]" \
            src/ 2>/dev/null || true)

          if [ -n "$FOUND" ]; then
            echo "::error::Hardcoded secret-style assignment detected in source:"
            echo "$FOUND"
            exit 1
          fi

          PATTERN_MATCHES=$(grep -RInE \
            "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|ghp_[A-Za-z0-9_]{36}|sk-[A-Za-z0-9]{20,})" \
            src public Dockerfile nginx.conf package.json package-lock.json 2>/dev/null || true)

          if [ -n "$PATTERN_MATCHES" ]; then
            echo "::error::Potential leaked secret pattern detected:"
            echo "$PATTERN_MATCHES"
            exit 1
          fi

          echo "✅ No hardcoded secrets or common leaked secret patterns detected"

  # ─────────────────────────────────────────────
  # JOB 4: Docker Build Check
  # ─────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [build, security]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nutrigrow-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
