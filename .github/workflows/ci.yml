name: CI — Frontend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint TypeScript & ESLint
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 TypeScript & ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./

      - name: Run TypeScript compiler check
        run: npx tsc -b --noEmit
        working-directory: ./

      - name: Run ESLint
        run: npm run lint
        working-directory: ./

  # ─────────────────────────────────────────────
  # JOB 2: Build Check
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Vite Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./

      - name: Create dummy .env for build
        run: |
          echo "VITE_API_URL=https://api.nutrigrow.id" > .env
        working-directory: ./

      - name: Build application
        run: npm run build
        working-directory: ./

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Security Audit
  # ─────────────────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./

      - name: Run security audit
        run: npm audit --audit-level=high
        working-directory: ./
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 4: Docker Build Check
  # ─────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nutrigrow-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
